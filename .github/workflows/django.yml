name: Django CI

on:
  push:
    branches: [ "development", "back/feat-autotest_and_docker" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        # РОБОТ СКАЧАЕТ ВООБЩЕ ВСЕ ТВОИ БИБЛИОТЕКИ, ВКЛЮЧАЯ DOTENV И ДРАЙВЕР POSTGRESQL!
        pip install -r requirements.txt
        
    - name: Run Tests
      working-directory: backend
      run: |
        python manage.py test
