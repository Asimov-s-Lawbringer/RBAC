name: Django CI

on:
  push:
    branches: [ "development", "back/feat-autotest_and_docker" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      working-directory: backend  # <-- ГОВОРИМ РОБОТУ ЗАЙТИ В ПАПКУ БЭКЕНДА
      run: |
        python -m pip install --upgrade pip
        pip install django djangorestframework django-cors-headers psycopg2-binary
        
    - name: Run Tests
      working-directory: backend  # <-- И ЗДЕСЬ ТОЖЕ ЗАХОДИМ В ПАПКУ БЭКЕНДА иначе он не находит!
      run: |
        python manage.py test
